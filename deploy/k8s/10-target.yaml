# The neutral target: one chi handler over stdlib H1/H2, quic-go H3, and
# grpc-go. Fixed and identical for both arms of every regime (ADR-0001).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
  namespace: poseidon-bench
  labels: { app: target }
spec:
  replicas: 1
  selector:
    matchLabels: { app: target }
  template:
    metadata:
      labels: { app: target }
    spec:
      containers:
        - name: target
          image: poseidon-tests:local
          imagePullPolicy: Never # side-loaded into the kind nodes, never pulled
          command: ["/target"]
          args: ["-plain=:8080", "-tls=:8443", "-h3=:8444", "-grpc=:9443", "-seed=1"]
          ports:
            - { name: plain, containerPort: 8080, protocol: TCP }
            - { name: tls, containerPort: 8443, protocol: TCP }
            - { name: h3, containerPort: 8444, protocol: UDP }
            - { name: grpc, containerPort: 9443, protocol: TCP }
          # Generous and equal on both sides so nothing throttles: we are
          # measuring true consumption, not behaviour under constraint
          # (ADR/CONTEXT: "generous limits, observe-only"). The target is
          # given more than the driver so it can never become the bottleneck
          # that flattens a difference between the two client arms.
          resources:
            requests: { cpu: "2", memory: "1Gi" }
            limits: { cpu: "4", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: plain }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: plain }
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: target
  namespace: poseidon-bench
  labels: { app: target }
spec:
  selector: { app: target }
  ports:
    - { name: plain, port: 8080, targetPort: 8080, protocol: TCP }
    - { name: tls, port: 8443, targetPort: 8443, protocol: TCP }
    - { name: h3, port: 8444, targetPort: 8444, protocol: UDP }
    - { name: grpc, port: 9443, targetPort: 9443, protocol: TCP }
