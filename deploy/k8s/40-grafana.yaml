# Grafana, pre-provisioned with the Prometheus datasource and one dashboard
# that plots the two arms of a regime against each other. Anonymous admin
# access: this is a throwaway local cluster, and a login prompt between the
# operator and the graph is pure friction.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: poseidon-bench
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.poseidon-bench.svc.cluster.local:9090
        isDefault: true

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bench
        type: file
        options:
          path: /var/lib/grafana/dashboards

  bench.json: |
    {
      "title": "poseidon vs standard",
      "uid": "poseidon-bench",
      "time": { "from": "now-45m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries", "title": "CPU (cores) — by arm",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{
            "expr": "rate(driver_cpu_busy_seconds_total[1m])",
            "legendFormat": "{{regime}} / {{arm}}"
          }]
        },
        {
          "type": "timeseries", "title": "Allocations per second",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{
            "expr": "rate(driver_alloc_objects_total[1m])",
            "legendFormat": "{{regime}} / {{arm}}"
          }]
        },
        {
          "type": "timeseries", "title": "RSS",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{
            "expr": "driver_rss_bytes",
            "legendFormat": "{{regime}} / {{arm}}"
          }]
        },
        {
          "type": "timeseries", "title": "Achieved RPS (must match across arms)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{
            "expr": "rate(driver_requests_total[1m])",
            "legendFormat": "{{regime}} / {{arm}}"
          }]
        },
        {
          "type": "timeseries", "title": "Allocations per request (the headline number)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [{
            "expr": "rate(driver_alloc_objects_total[1m]) / rate(driver_requests_total[1m])",
            "legendFormat": "{{regime}} / {{arm}}"
          }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: poseidon-bench
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          ports:
            - { name: web, containerPort: 3000 }
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasource.yaml, path: datasource.yaml }]
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          configMap:
            name: grafana-provisioning
            items: [{ key: bench.json, path: bench.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: poseidon-bench
spec:
  selector: { app: grafana }
  ports:
    - { name: web, port: 3000, targetPort: 3000 }
